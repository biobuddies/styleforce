[tasks.build]
run = 'uv build --wheel --python 3.12 --out-dir dist'

[tasks.test]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
uv pip install .
# `pytest`, not `python -m pytest`: the latter puts the repo root on sys.path, so the
# uncompiled source `styleforce` shadows the installed wheel's `styleforce._native`.
pytest --cov${PYTEST_COV-} \
    --cov-report=term-missing:skip-covered --verbose "$@"
'''
