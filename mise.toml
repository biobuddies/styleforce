[tasks.build]
run = 'uv build --wheel --python 3.12 --out-dir dist'

[tasks.release]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
prefix=$(date -u '+v%Y.%U.')
git fetch --tags
latest=$(git tag --list "$prefix*" --sort=-version:refname | head -1)
count=${latest#"$prefix"}
tabr="$prefix$(printf '%02d' "$((10#${count:-0} + 1))")"
gh release create "$tabr" --generate-notes --target "$(git rev-parse HEAD)" >&2
git fetch --tags
[[ -z ${GITHUB_OUTPUT-} ]] || echo "tabr=$tabr" >> "$GITHUB_OUTPUT"
GITHUB_REF_NAME=$tabr mise set-environment >&2
echo "$tabr"
'''

[tasks.set-package-version]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
tabr=${TABR:-$(mise tabr)}
[[ $tabr =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]
sed -i.bak -E 's/^version = "[^"]+"/version = "'"${tabr#v}"'"/' \
    styleforce/rust/Cargo.toml
'''

[tasks.test]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
uv pip install dist/*.whl
test_directory=$(mktemp -d)
trap 'rm -rf "$test_directory"' EXIT
cd "$test_directory"
pytest --pyargs styleforce.tests --cov${PYTEST_COV-} \
    --cov-report=term-missing:skip-covered --verbose "$@"
'''

[tasks.twine-check]
run = 'uvx twine check --strict dist/*'
