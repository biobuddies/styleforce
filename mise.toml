[tasks.build]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
# diagnostic: TABR and the inputs mise tabr resolved it from in this job
echo "diag build: TABR=${TABR:?} REF_NAME=${GITHUB_REF_NAME-} HEAD_REF=${GITHUB_HEAD_REF-}"
echo "diag build: tags=$(git tag --points-at HEAD 2>/dev/null | paste -sd, -)"
# rewrite the placeholder version only for release tags
if [[ $TABR =~ ^v[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
    sed -i.bak -E 's/^version = "[^"]+"/version = "'"${TABR#v}"'"/' styleforce/rust/Cargo.toml
fi
# maturin tags plain linux by default; target the container's manylinux policy for PyPI
if [[ ${AUDITWHEEL_PLAT-} ]]; then
    compatibility=${AUDITWHEEL_PLAT%_x86_64}
    export MATURIN_PEP517_ARGS="--compatibility ${compatibility%_aarch64}"
fi
uv build --wheel --python 3.12 --out-dir dist
python pypi_compatible_build.py
'''

[tasks.release]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
prefix=$(date -u '+v%Y.%-U.')
git fetch --tags
latest=$(git tag --list "$prefix*" --sort=-version:refname | head -1)
count=${latest#"$prefix"}
tabr="$prefix$((10#${count:-0} + 1))"
gh release create "$tabr" --generate-notes --target "$(git rev-parse HEAD)" >&2
git fetch --tags
[[ -z ${GITHUB_OUTPUT-} ]] || echo "tabr=$tabr" >> "$GITHUB_OUTPUT"
GITHUB_REF_NAME=$tabr mise set-environment
'''

[tasks.test]
run = '''
#!/usr/bin/env bash
set -o errexit -o nounset -o pipefail
uv pip install dist/*.whl
test_directory=$(mktemp -d)
trap 'rm -rf "$test_directory"' EXIT
cd "$test_directory"
pytest --pyargs styleforce.tests --cov${PYTEST_COV-} \
    --cov-report=term-missing:skip-covered --verbose "$@"
'''

[tasks.twine-check]
run = 'uvx twine check --strict dist/*'

[tools]
# The manylinux build container lacks the runner's global gh
# pinning latest as of 2026-09-19 because CCW can't handle dynamic latest
gh = '2.101.0'
