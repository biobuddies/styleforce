[build-system]
requires = ['maturin>=1.7,<2.0']
build-backend = 'maturin'

[project]
name = 'styleforce'
version = '0.0.3'
description = 'Shared GritQL rules for enforcing source-code style.'
requires-python = '>=3.12'
dependencies = []

[dependency-groups]
test = [
  'pytest>=8',
]

[tool.maturin]
# The Rust crate that produces the native `styleforce_py` extension module.
manifest-path = 'Cargo.toml'
# We build an abi3-py312 wheel, so the resulting artifact is
# `styleforce-0.0.3-cp312-abi3-<platform>.whl` and works on any Python >= 3.12.
# TODO: verify maturin picks up the correct platform tag for each CI runner.
python-source = 'python'
module-name = 'styleforce._native'
# TODO: confirm the data files (.grit patterns) are included in the wheel.
# Maturin supports `[tool.maturin.data]` or a `python/styleforce/` package dir;
# we may need to add the .grit patterns as package data or a separate step.
