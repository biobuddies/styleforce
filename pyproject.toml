[build-system]
requires = ['maturin>=1.7,<2.0']
build-backend = 'maturin'

[project]
name = 'styleforce'
version = '0.0.3'
description = 'Shared GritQL rules for enforcing source-code style.'
requires-python = '>=3.12'
dependencies = []

[dependency-groups]
test = [
  'pytest>=8',
]

[tool.maturin]
manifest-path = 'styleforce/rust/Cargo.toml'
python-source = '.'
module-name = 'styleforce._native'
exclude = ['styleforce/rust/**']
