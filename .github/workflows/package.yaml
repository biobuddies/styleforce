name: package

on: # yamllint disable-line rule:truthy
    push:
        branches:
            - main
            - claude/pi-package-quote-style-6lfmt5
    workflow_dispatch:

permissions:
    contents: read

env:
    GRIT_TELEMETRY_DISABLED: true

defaults:
    run:
        shell: bash --noprofile --norc -o errexit -o nounset -o pipefail -o xtrace {0}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v7
            - run: uv python install 3.12
            - run: uv build --wheel --python 3.12 --out-dir dist
            - uses: actions/upload-artifact@v4
              with:
                  name: wheel
                  path: dist/*.whl

    release:
        needs: build
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: wheel
                  path: dist
            - env:
                  GH_TOKEN: ${{ github.token }}
              run: >
                  gh release create v${{ github.run_id }} dist/*.whl
                  --repo ${{ github.repository }}
                  --target ${{ github.sha }}
                  --title v${{ github.run_id }}
                  --notes 'Pure-Python wheel built from ${{ github.sha }}'
            - uses: astral-sh/setup-uv@v7
            - continue-on-error: true
              run: uv publish dist/*.whl
