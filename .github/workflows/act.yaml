name: act

on: # yamllint disable-line rule:truthy
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

defaults:
    run:
        shell: bash --noprofile --norc -o errexit -o nounset -o pipefail -o xtrace {0}

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - run: |
                  git submodule update --init vendor/gritql
                  git -C vendor/gritql submodule update --init \
                      vendor/tree-sitter-facade vendor/tree-sitter-gritql vendor/web-tree-sitter
                  git -C vendor/gritql apply ../../patches/gritql-python-only.patch
            - uses: dtolnay/rust-toolchain@stable
            - uses: jdx/mise-action@v3
              with:
                  experimental: true
            - run: uv pip install .
            - run: .venv/bin/pytest tests/ -vv -s

run-name: Testing on behalf of ${{ github.actor }}
