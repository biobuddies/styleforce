name: act

on: # yamllint disable-line rule:truthy
    pull_request:
    push:
        branches:
            - main
            - really-really-fix-release
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-${{ github.event_name == 'push' && 'main' || github.ref }}
    cancel-in-progress: ${{ github.event_name != 'push' }}

defaults:
    run:
        shell: bash --noprofile --norc -o errexit -o nounset -o pipefail -o xtrace {0}

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
            - run: |
                  git submodule update --init vendor/gritql
                  git -C vendor/gritql submodule update --init \
                      vendor/tree-sitter-facade vendor/tree-sitter-gritql vendor/web-tree-sitter
                  git -C vendor/gritql apply ../../patches/gritql-python-only.patch
            - uses: dtolnay/rust-toolchain@stable
            - uses: jdx/mise-action@v3
              with:
                  experimental: true
            - run: mise set-environment
            - run: mise build
            - run: mise twine-check
            - run: mise test
            # TODO: delete the tag and release when a later build or publish job fails
            - if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: mise release

    build:
        needs: test
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: macos-arm64
                      os: macos-14
                    - name: linux-x86-64
                      os: ubuntu-latest
                      container: quay.io/pypa/manylinux_2_28_x86_64
                    - name: linux-arm64
                      os: ubuntu-24.04-arm
                      container: quay.io/pypa/manylinux_2_28_aarch64
        runs-on: ${{ matrix.os }}
        container: ${{ matrix.container }}
        steps:
            - uses: actions/checkout@v7
            # Root in the container does not own the mounted workspace or submodules
            - if: matrix.container
              run: git config --global --add safe.directory '*'
            - run: |
                  git submodule update --init vendor/gritql
                  git -C vendor/gritql submodule update --init \
                      vendor/tree-sitter-facade vendor/tree-sitter-gritql vendor/web-tree-sitter
                  git -C vendor/gritql apply ../../patches/gritql-python-only.patch
            - uses: dtolnay/rust-toolchain@stable
            - uses: jdx/mise-action@v3
              with:
                  experimental: true
            - run: mise set-environment
            - run: mise build
            - run: mise twine-check
            - uses: actions/upload-artifact@v4
              with:
                  name: wheel-${{ matrix.name }}
                  path: dist/*.whl
            - if: github.event_name == 'push'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "$TABR" dist/*.whl

    publish:
        if: github.event_name == 'push' && github.ref_name == 'main'
        needs: build
        environment:
            name: prod
        permissions:
            id-token: write
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                name:
                    - macos-arm64
                    - linux-x86-64
                    - linux-arm64
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: wheel-${{ matrix.name }}
                  path: dist
            - uses: pypa/gh-action-pypi-publish@release/v1

    published:
        needs: publish
        runs-on: ubuntu-latest
        steps:
            - run: true

run-name: Acting on behalf of ${{ github.actor }}
